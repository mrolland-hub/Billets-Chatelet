<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billets Châtelet</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:800px;
    margin:40px auto;
    padding:20px;
    background:#f5f5f5;
}

.container{
    background:white;
    border-radius:12px;
    padding:30px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    margin-top:0;
}

.dropzone{
    border:2px dashed #666;
    border-radius:12px;
    padding:40px 20px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
    background:#fafafa;
    margin-bottom:20px;
}

.dropzone:hover{
    background:#f2f2f2;
}

.dropzone.dragover{
    border-color:#111;
    background:#e8f3ff;
}

button{
    width:100%;
    padding:14px;
    font-size:16px;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#nombre{
    margin:15px 0;
    color:#555;
}

#resultat{
    margin-top:25px;
    white-space:pre-wrap;
}

</style>
</head>

<body>

<div class="container">

<h1>Billets Châtelet</h1>

<div id="dropzone" class="dropzone">
    <strong>Déposez vos PDF ici</strong><br>
    ou cliquez pour les sélectionner.
</div>

<input
id="fichiers"
type="file"
accept=".pdf,application/pdf"
multiple
hidden>

<div id="nombre">
Aucun fichier sélectionné.
</div>

<button id="traiter">
Traiter les billets
</button>

<div id="resultat"></div>

</div>

<script src="app.js"></script>

</body>
</html>
